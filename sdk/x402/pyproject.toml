[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "attestseal-x402"
version = "0.1.0"
description = "AttestSeal trust attestation headers for x402 / AP2 / MPP payment protocols. Drop-in middleware for FastAPI/Flask/aiohttp servers and a verifier for httpx/aiohttp clients."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "AttestSeal, Inc.", email = "alu@attestseal.com" }]
requires-python = ">=3.10"
keywords = ["attestseal", "x402", "agent-commerce", "trust", "payment", "402", "ed25519", "did"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "PyNaCl>=1.5.0",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
fastapi = ["fastapi>=0.100.0", "starlette>=0.27.0"]
flask = ["Flask>=2.3.0"]
aiohttp = ["aiohttp>=3.9.0"]
test = ["pytest>=7.4.0", "pytest-asyncio>=0.21.0", "respx>=0.20.0"]

[project.urls]
Homepage = "https://attestseal.com"
Documentation = "https://github.com/AttestSeal/attestseal/blob/main/spec/X-ATTESTSEAL-HEADERS.md"
Repository = "https://github.com/AttestSeal/attestseal"
Issues = "https://github.com/AttestSeal/attestseal/issues"
Changelog = "https://github.com/AttestSeal/attestseal/blob/main/sdk/x402/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["attestseal_x402*"]

[tool.setuptools.package-data]
attestseal_x402 = ["py.typed"]
